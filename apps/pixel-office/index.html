<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mia Pixel Office</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0e14; color: #e6e9f0; font: 13px/1.45 system-ui, sans-serif; }
  header { padding: 10px 14px; border-bottom: 1px solid #232936; display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 15px; margin: 0; }
  header span { color: #8a8f99; font-size: 12px; }
  main { display: flex; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
  #game canvas { border: 1px solid #232936; border-radius: 8px; image-rendering: pixelated; }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 300px; flex: 1; }
  section.panel { border: 1px solid #232936; border-radius: 8px; padding: 10px 12px; background: #10141c; }
  section.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8a8f99; margin: 0 0 8px; }
  #chat-log { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  #chat-log .u { align-self: flex-end; background: #1d2b45; border-radius: 8px; padding: 6px 9px; max-width: 90%; }
  #chat-log .a { align-self: flex-start; background: #18202e; border-radius: 8px; padding: 6px 9px; max-width: 90%; white-space: pre-wrap; }
  #chat-form { display: flex; gap: 6px; }
  #chat-form input { flex: 1; background: #0b0e14; border: 1px solid #232936; color: inherit; border-radius: 6px; padding: 6px 8px; }
  #chat-form button { background: #2b3c5e; color: inherit; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #task-list { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  #task-list li { border-left: 3px solid #8a8f99; padding: 2px 8px; background: #141821; border-radius: 0 6px 6px 0; }
  #task-list li[data-s="done"] { border-color: #5bd68a; }
  #task-list li[data-s="failed"] { border-color: #e85d7e; }
  #task-list li[data-s="waiting"] { border-color: #e8c15d; }
  #task-list li[data-s="working"] { border-color: #6aa8ff; }
  .row { display: flex; gap: 12px; padding: 0 14px 14px; flex-wrap: wrap; }
  .row section.panel { flex: 1; min-width: 300px; }
  #inspector { min-height: 40px; }
  #syslog { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  #syslog li { color: #aab2c5; }
</style>
</head>
<body>
<header>
  <h1>Mia Pixel Office</h1>
  <span id="conn">connecting…</span>
  <span>Tambahkan ?user=nama di URL untuk melihat bus user itu (default: owner).</span>
</header>
<main>
  <div id="game"></div>
  <aside>
    <section class="panel" id="panel-chat">
      <h2>Chat</h2>
      <div id="chat-log"></div>
      <form id="chat-form"><input id="chat-input" autocomplete="off" placeholder="Tanya Mia…" /><button type="submit">Kirim</button></form>
    </section>
    <section class="panel" id="panel-tasks">
      <h2>Tasks</h2>
      <ul id="task-list"><li>Menunggu task pertama…</li></ul>
    </section>
  </aside>
</main>
<div class="row">
  <section class="panel" id="panel-inspector">
    <h2>Inspector</h2>
    <div id="inspector">Klik avatar untuk detail.</div>
  </section>
  <section class="panel" id="panel-log">
    <h2>System Log</h2>
    <ol id="syslog"></ol>
  </section>
</div>
<script type="module" src="./office.js"></script>
<script type="module" src="./panels.js"></script>
<script type="module">
  // Visible boot reporter: every step writes into #syslog/#conn so a failure
  // shows as TEXT in a screenshot (no devtools needed). Dynamic import() is
  // used (instead of static imports) so a module-load failure is caught here
  // instead of silently killing the whole script.
  const log = (m) => {
    try {
      const ol = document.getElementById("syslog");
      if (ol) { const li = document.createElement("li"); li.textContent = String(m); ol.append(li); }
      const st = document.getElementById("conn");
      if (st) st.textContent = String(m);
    } catch { /* ignore */ }
  };
  window.addEventListener("error", (e) => log("error: " + (e.message || e.error)));
  window.addEventListener("unhandledrejection", (e) => log("error: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));
  try {
    log("boot: loading modules…");
    const [{ bootFromMap }, { bootPanels }] = await Promise.all([import("./office.js"), import("./panels.js")]);
    log("boot: modules ok");
    const user = new URLSearchParams(location.search).get("user") || "naufalazhar652952";
    const holder = document.getElementById("game");
    const canvas = document.createElement("canvas");
    canvas.width = 640;
    canvas.height = 384;
    holder.append(canvas);
    log("boot: canvas ok");
    bootFromMap(canvas).then(() => log("boot: game ok")).catch((e) => log("boot game FAILED: " + (e && e.message ? e.message : e)));
    try { bootPanels(user); log("boot: panels ok"); } catch (e) { log("boot panels FAILED: " + (e && e.message ? e.message : e)); }
  } catch (e) {
    log("boot modules FAILED: " + (e && e.message ? e.message : e));
  }
</script>
</body>
</html>
