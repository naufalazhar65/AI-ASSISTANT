name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # A key the code reads but nobody can configure is a silent feature
      # break. The check is pure node (no deps, no network): it fails when a
      # var is read but missing from apps/web/.env.example.
      - name: Env vars documented
        run: node apps/web/scripts/check-env-documented.mjs
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI red 2026-09-26: reportDelivery.test.ts renders a real PDF via
      # reportPdf → chromium.launch, which needs the Playwright browser
      # (same requirement the e2e job already covers for verify.ts).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (browsers + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
  honesty:
    # Honesty guards smoke suite — adversarial two-way probe (FIRE on live
    # fabrication patterns, SILENT on honest sentences) + runAgent wiring
    # checks. Pure/no-network (no LLM, no .env.local needed); the LIVE LLM
    # drills (drill-*.mts) stay manual via 9router. Failing = PR red.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Honesty guards smoke suite
        run: npx tsx apps/web/probe-honesty-guards.mts
  dashboard:
    # The office dashboard has its own gates, and they were never run by CI:
    # a broken chat panel or a broken 3D scene could merge green. Both gates
    # are dependency-free (node built-ins + the vendored three.js), so this
    # job needs no browser and no running server:
    #   - chat-core.test.mjs: the chat panel's pure logic (43 node:test cases).
    #   - probe-furniture-validate.js: renders index.html's inline scene script
    #     in a stub browser and validates the office furniture. It proxies
    #     /api/* read-only to the office server and falls back to the honest
    #     offline path when the server is down, so it is safe without one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chat panel core tests
        run: node --test apps/office-dashboard/chat-core.test.mjs
      - name: Dashboard Live transport tests
        run: node --test apps/office-dashboard/live.test.mjs
      - name: Live bundle is in sync with the source
        # The committed vendor/live.bundle.js must match what the source
        # builds to — otherwise the dashboard runs an older Live client than
        # the app does, and nobody notices until a voice bug.
        run: |
          npm run build:dashboard-live
          git diff --exit-code -- apps/office-dashboard/vendor/live.bundle.js
      - name: Office furniture probe
        run: node apps/office-dashboard/probe-furniture-validate.js
      - name: Test-user cleanup (dry run)
        run: npx tsx apps/web/scripts/cleanup-test-users.mts
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @voice/web
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (browsers + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx tsx apps/web/verify.ts
      # The office-chat transcript isolation: each agent keeps its OWN session
      # collection, and the web app must never restore an office transcript.
      # Hermetic (throwaway user, cleaned up) — no provider call.
      - run: npx tsx apps/web/drill-office-isolation.mts

  # Stage B of the evaluation plan: the deterministic eval suite runs on every
  # push/PR. No model calls, no credentials — cases that need a provider stay
  # BLOCKED and are reported as such (never counted as passes).
  eval:
    name: eval (deterministic suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
      # After the run, and never with `ignore`: a green job that uploaded
      # nothing hid every eval failure until someone read the log (audit 2026-10-16).
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: apps/web/.data/eval/runs/**/report.md
          if-no-files-found: warn
